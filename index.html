<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeOrder System - Prototipo Final Único</title>
    <style>
        /* Paleta de Colores Corporativa (Verde, Café y Blanco) de Alta Fidelidad */
        :root {
            --bg-main: #FCF9F6;
            --sidebar-bg: #2B1A11;
            --sidebar-text: #A3968E;
            --sidebar-text-active: #2B1A11;
            --sidebar-active-bg: #E5E7D6;
            --text-dark: #2B1A11;
            --card-bg: #FFFFFF;
            --border-color: #E6E1DA;
            
            /* Columnas Kanban */
            --col-new-bg: #E4F0F6;
            --col-new-text: #2A5B7A;
            --col-prep-bg: #FDF3E7;
            --col-prep-text: #A75D24;
            --col-ready-bg: #EBF3E6;
            --col-ready-text: #4E7C3A;
            
            /* Alertas y Botones Especiales */
            --alert-bg: #FDF2F2;
            --alert-border: #F8B4B4;
            --alert-text: #C81E1E;
            --btn-red: #A92323;
            --btn-coral: #FFE3E1;
            --btn-coral-text: #8A1F1F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
        }

        /* --- CONTROLADOR DE VISTA DE LOGIN --- */
        #login-view {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-main);
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .login-card h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .login-card p.subtitle {
            color: #7A6E67;
            font-size: 14px;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background-color: #FCFBF9;
            color: var(--text-dark);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--text-dark);
        }

        .btn-login {
            width: 100%;
            background-color: var(--sidebar-bg);
            color: #FFFFFF;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background-color: #42281A;
        }

        .login-helper {
            margin-top: 24px;
            font-size: 12px;
            color: #8C827A;
            line-height: 1.6;
            background: #F5F1EC;
            padding: 12px;
            border-radius: 6px;
        }

        .login-error-msg {
            color: var(--alert-text);
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        /* --- ARQUITECTURA DISTRIBUIDA DE LA APP --- */
        #app-layout {
            display: none;
            height: 100vh;
            grid-template-columns: 260px 1fr;
        }

        /* --- SIDEBAR IZQUIERDO CORPORATIVO --- */
        aside {
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            color: #FFFFFF;
        }

        .brand-section {
            margin-bottom: 32px;
            padding-left: 8px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand-status {
            font-size: 12px;
            color: #A3968E;
            margin-top: 4px;
        }

        .nav-menu {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            color: var(--sidebar-text);
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-item svg {
            margin-right: 12px;
            fill: currentColor;
        }

        .nav-item:hover {
            color: #FFFFFF;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background-color: var(--sidebar-active-bg);
            color: var(--sidebar-text-active);
            font-weight: 600;
        }

        .sidebar-footer {
            border-top: 1px solid #42281A;
            padding-top: 16px;
        }

        .btn-close-shift {
            width: 100%;
            background-color: var(--btn-coral);
            color: var(--btn-coral-text);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
            text-align: center;
        }

        /* --- PANEL DE CONTENIDO GENERAL --- */
        main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 60px;
            background-color: #FFFFFF;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 32px;
            gap: 24px;
        }

        .top-status {
            font-size: 13px;
            color: #7A6E67;
        }

        .top-user-role {
            font-size: 14px;
            font-weight: 600;
            border-left: 1px solid var(--border-color);
            padding-left: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-dark);
            display: flex;
            align-items: center;
        }

        .view-content {
            flex-grow: 1;
            padding: 24px 32px;
            overflow-y: auto;
            background-color: var(--bg-main);
        }

        .view-section {
            display: none;
            height: 100%;
        }

        .view-section.active {
            display: block;
        }

        /* --- VISTA DE COCINA KANBAN --- */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            height: calc(100vh - 140px);
        }

        .kanban-column {
            background-color: transparent;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .column-header {
            padding: 14px 20px;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .column-header.new { background-color: var(--col-new-bg); color: var(--col-new-text); }
        .column-header.prep { background-color: var(--col-prep-bg); color: var(--col-prep-text); }
        .column-header.ready { background-color: var(--col-ready-bg); color: var(--col-ready-text); }

        .column-count {
            background-color: var(--text-dark);
            color: #FFFFFF;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .column-cards-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 4px;
        }

        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            position: relative;
        }

        .order-card.alert-priority {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-id {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .card-timer {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            background: #F0EDE8;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .order-card.alert-priority .card-timer {
            background: #FCE8E6;
            color: var(--alert-text);
        }

        .card-table {
            font-size: 13px;
            font-weight: 600;
            color: #554A42;
            margin-bottom: 12px;
        }

        .card-items-list {
            list-style: none;
            margin-bottom: 16px;
        }

        .card-items-list li {
            font-size: 14px;
            margin-bottom: 6px;
            color: #4A3E36;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-items-list input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--sidebar-bg);
            cursor: pointer;
        }

        .card-items-list li.checked-item {
            text-decoration: line-through;
            color: #A3968E;
        }

        .card-action-btn {
            width: 100%;
            background-color: var(--sidebar-bg);
            color: #FFFFFF;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-action-btn.secondary {
            background-color: var(--sidebar-active-bg);
            color: var(--sidebar-text-active);
        }

        .status-badge-text {
            font-size: 14px;
            font-style: italic;
            color: #7A6E67;
            margin-bottom: 16px;
        }

        /* --- DASHBOARD DE ADMINISTRACIÓN --- */
        .placeholder-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #7A6E67;
            font-size: 16px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            background: #FFFFFF;
        }

        /* --- PAGOS DE CAJA --- */
        .cashier-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            height: calc(100vh - 200px);
        }

        .cashier-pane {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .cashier-pane-white {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .pane-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .search-box-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box-container input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #FDFBF9;
        }

        .search-icon-svg {
            position: absolute;
            left: 10px;
            top: 11px;
            color: #92857C;
        }

        .unpaid-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .unpaid-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .unpaid-card:hover, .unpaid-card.selected {
            border-color: var(--sidebar-bg);
            background-color: #FAF6F2;
        }

        .unpaid-card-tag {
            background-color: var(--sidebar-active-bg);
            color: var(--sidebar-text-active);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .unpaid-card-id {
            font-size: 12px;
            color: #7A6E67;
            margin-left: 6px;
        }

        .unpaid-card-items {
            font-size: 14px;
            color: var(--text-dark);
        }

        .unpaid-card-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .payment-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #7A6E67;
            text-align: center;
            gap: 16px;
        }

        .payment-details-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .bill-header {
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .bill-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 700;
            border-top: 1px solid var(--text-dark);
            padding-top: 16px;
            margin-top: 16px;
        }

        .cashier-footer-bar {
            margin-top: 24px;
            background-color: #E6E1DA;
            border-radius: 8px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-accumulated-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #554A42;
        }

        .footer-accumulated-value {
            font-size: 32px;
            font-weight: 700;
        }

        .footer-accumulated-value span {
            font-size: 14px;
            font-weight: 500;
            color: #554A42;
            margin-left: 8px;
        }

        .btn-cierre-caja {
            background-color: var(--btn-red);
            color: #FFFFFF;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* --- MODAL DE CIERRE DE CAJA --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
        }

        .modal-card h2 {
            font-size: 22px;
            margin-bottom: 16px;
        }

        .modal-actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn.primary { background-color: var(--sidebar-bg); color: #FFFFFF; }
        .modal-btn.secondary { background-color: #E6E1DA; color: var(--text-dark); }
    </style>
</head>
<body>

    <section id="login-view">
        <div class="login-card">
            <div class="login-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2B1A11" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                    <line x1="6" y1
